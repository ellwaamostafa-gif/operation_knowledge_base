const { useState, useEffect, useRef } = React;

/* ---------- accent palette (one hex per activity; drives --accent on the screen) ---------- */
const ACCENT = {
  violet: "#6d47c9", green: "#2f7d5b", teal:  "#12786f", blue:   "#2f5fd0",
  amber:  "#a5701a", red:   "#b0463f", stone: "#4f5a66", pink:   "#9a5a9e",
  indigo: "#4a5bbf", cyan:  "#0e7490",
};
const tint = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

/* ---------- Material Symbols name per activity ---------- */
const MS_ICON = {
  GraduationCap: "school", Sprout: "psychiatry", Pill: "medication", Ship: "directions_boat",
  Building2: "apartment", Factory: "factory", Warehouse: "warehouse",
  Stethoscope: "stethoscope", IdCard: "badge", ShieldCheck: "verified_user",
};

/* ---------- arabic numerals + counts ---------- */
const arNum = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const arPhases = (n) =>
  n === 0 ? "لا توجد مراحل" : n === 1 ? "مرحلة واحدة" : n === 2 ? "مرحلتان"
  : n <= 10 ? arNum(n) + " مراحل" : arNum(n) + " مرحلة";

function Icon({ name, size = 24, style }) {
  return <span className="ms" aria-hidden="true" style={{ fontSize: size, ...style }}>{name}</span>;
}

/* ---------- references / links ----------
   Any node or sub-node may carry:  links: [{ label, url, type }]
   type is optional: "video" | "doc" | "link" — inferred from the URL when omitted. */
const linkKind = (l) => {
  if (l.type) return l.type;
  const u = (l.url || "").toLowerCase();
  if (/youtube\.com|youtu\.be|vimeo\.com|\.mp4|tiktok\.com/.test(u)) return "video";
  if (/\.pdf|\.docx?$/.test(u)) return "doc";
  return "link";
};
const LINK_META = {
  video: { icon: "play_circle", label: "فيديو" },
  doc:   { icon: "description",  label: "مستند" },
  link:  { icon: "open_in_new",  label: "رابط" },
};

function Links({ links, color }) {
  if (!links || !links.length) return null;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12 }}>
      {links.map((l, i) => {
        const m = LINK_META[linkKind(l)];
        return (
          <a key={i} href={l.url} target="_blank" rel="noopener noreferrer" className="tap"
             title={l.url}
             style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 13px",
                      border: "1px solid " + tint(color, .35), borderRadius: 999,
                      background: tint(color, .09), color, textDecoration: "none",
                      fontSize: 15, fontWeight: 600 }}>
            <Icon name={m.icon} size={20} />
            <span>{l.label || m.label}</span>
          </a>
        );
      })}
    </div>
  );
}

/* search across activities, phases and sub-nodes */
function searchAll(q) {
  const s = q.trim();
  if (!s) return [];
  const hit = (t) => !!t && t.indexOf(s) !== -1;
  const out = [];
  ACTIVITIES.forEach((act) => {
    if (hit(act.titleAr) || hit(act.descAr)) out.push({ act: act, phase: null, title: act.titleAr, sub: act.descAr });
    act.nodes.forEach((node, ni) => {
      if (hit(node.title)) out.push({ act: act, phase: ni, title: node.title, sub: act.titleAr });
      node.subnodes.forEach((sn) => {
        if (hit(sn.title) || hit(sn.platform) || hit(sn.action) || (sn.requirements || []).some(hit))
          out.push({ act: act, phase: ni, title: sn.title, sub: act.titleAr + " — " + node.title });
      });
    });
  });
  return out.slice(0, 40);
}

  const [pendingPhase, setPendingPhase] = useState(null);
  const history = useRef([]);

  const active = ACTIVITIES.find((x) => x.id === activeId);

  const go = (next) => {
    if (next !== scr) history.current.push(scr);
    setScr(next);
    window.scrollTo(0, 0);
  };
  const openArticle = (id, phase) => {
    setActiveId(id);
    setPendingPhase(phase === undefined ? null : phase);
    go("article");
  };
  const back = () => { setScr(history.current.pop() || "home"); window.scrollTo(0, 0); };

  // scroll to the phase a search result pointed at, once the article is on screen
  useEffect(() => {
    if (scr !== "article" || pendingPhase === null) return;
    const el = document.getElementById("phase-" + pendingPhase);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84 });
    setPendingPhase(null);
  }, [scr, activeId, pendingPhase]);

  // accent follows the open activity
  useEffect(() => {
    document.documentElement.style.setProperty(
      "--accent", active && scr === "article" ? ACCENT[active.accent] : "#2f5fd0");
  }, [active, scr]);

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <TopBar showBack={scr !== "home"} onBack={back} onHome={() => go("home")} onSearch={() => go("search")} />
      {scr === "search" ? <Search onOpen={openArticle} />
        : scr === "article" && active ? <Article activity={active} onOpen={openArticle} />
        : <Home onOpen={openArticle} onSearch={() => go("search")} />}

      <footer style={{ marginTop: 40, borderTop: "1px solid var(--border)", background: "var(--surface)" }}>
        <div style={{ maxWidth: 860, margin: "0 auto", padding: "24px 20px", textAlign: "center",
                      color: "var(--fg-muted)", fontSize: 15.5, lineHeight: 1.8 }}>
          <p style={{ margin: 0 }}>دليل توضيحي لتأسيس الأنشطة التجارية — البيانات للأغراض التدريبية وقابلة للتحديث.</p>
          <p style={{ margin: "4px 0 0" }}>© 2026 — أعد بكل حب بواسطة عمران ومصطفى ❤️. جميع الحقوق محفوظة.</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
