/* ---------- accent palette (one hex per activity; drives --accent on the screen) ---------- */
const ACCENT = {
  violet: "#6d47c9", green: "#2f7d5b", teal:  "#12786f", blue:   "#2f5fd0",
  amber:  "#a5701a", red:   "#b0463f", stone: "#4f5a66", pink:   "#9a5a9e",
  indigo: "#4a5bbf", cyan:  "#0e7490", orange: "#b45309", rose:  "#be185d",
  emerald: "#065f46",
};
const tint = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

/* ---------- Material Symbols name per activity ---------- */
const MS_ICON = {
  GraduationCap: "school", Sprout: "psychiatry", Pill: "medication", Ship: "directions_boat",
  Building2: "apartment", Factory: "factory", Warehouse: "warehouse",
  Stethoscope: "stethoscope", IdCard: "badge", ShieldCheck: "verified_user", Store: "store",
  MapPin: "location_on", FlaskConical: "science", Percent: "percent", Handshake: "handshake",
  TrendingUp: "trending_up",
};

/* ---------- arabic numerals + counts ---------- */
const arNum = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
const arPhases = (n) =>
  n === 0 ? "لا توجد مراحل" : n === 1 ? "مرحلة واحدة" : n === 2 ? "مرحلتان"
  : n <= 10 ? arNum(n) + " مراحل" : arNum(n) + " مرحلة";

function Icon({ name, size = 24, style }) {
  return <span className="ms" aria-hidden="true" style={{ fontSize: size, ...style }}>{name}</span>;
}

/* ---------- references / links ----------
   Any node or sub-node may carry:  links: [{ label, url, type }]
   type is optional: "video" | "doc" | "link" — inferred from the URL when omitted. */
const linkKind = (l) => {
  if (l.type) return l.type;
  const u = (l.url || "").toLowerCase();
  if (/youtube\.com|youtu\.be|vimeo\.com|\.mp4|tiktok\.com/.test(u)) return "video";
  if (/\.pdf|\.docx?$/.test(u)) return "doc";
  return "link";
};
const LINK_META = {
  video: { icon: "play_circle", label: "فيديو" },
  doc:   { icon: "description",  label: "مستند" },
  link:  { icon: "open_in_new",  label: "رابط" },
};

function Links({ links, color }) {
  if (!links || !links.length) return null;
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12 }}>
      {links.map((l, i) => {
        const m = LINK_META[linkKind(l)];
        return (
          <a key={i} href={l.url} target="_blank" rel="noopener noreferrer" className="tap"
             title={l.url}
             style={{ display: "inline-flex", alignItems: "center", gap: 7, padding: "8px 13px",
                      border: "1px solid " + tint(color, .35), borderRadius: 999,
                      background: tint(color, .09), color, textDecoration: "none",
                      fontSize: 15, fontWeight: 600 }}>
            <Icon name={m.icon} size={20} />
            <span>{l.label || m.label}</span>
          </a>
        );
      })}
    </div>
  );
}

                       padding: "5px 11px", borderRadius: 999, background: tint(color, .12), color,

        </span>
      )}

      {sub.action && (
        <p style={{ fontSize: 16.5, color: expert ? "#78350f" : "var(--fg-muted)", lineHeight: 1.75, margin: "0 0 8px" }}>
          <span style={{ fontWeight: 700 }}>الإجراء: </span>{sub.action}

      )}

      {sub.requirements && sub.requirements.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: expert ? "#92400e" : "var(--fg-muted)", marginBottom: 8 }}>المتطلبات:</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {sub.requirements.map((r, i) => (
              <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 10, fontSize: 16.5,
                                    color: expert ? "#78350f" : "var(--fg-muted)", lineHeight: 1.7 }}>
                <Icon name={expert ? "warning" : "check_circle"} size={22}

      )}

      <Links links={sub.links} color={color} />
    </div>
  );
}

/* ---------- RoadmapTimeline: shared vertical-timeline renderer ---------- */
function RoadmapTimeline({ nodes, c }) {
  const jump = (i) => {
    const el = document.getElementById("phase-" + i);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84, behavior: "smooth" });
  };
  return (
    <div>
      {/* phase quick-jump pills */}
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, margin: "22px 0 30px" }}>
        {nodes.map((n, i) => (
          <button key={i} onClick={() => jump(i)} className="tap"
                  style={{ padding: "8px 14px", border: "1px solid var(--border)", borderRadius: 999,
                           background: "var(--surface)", color: "var(--fg-muted)", fontSize: 15, fontWeight: 600 }}>
            {arNum(i + 1)}. {n.title.replace(/^(المرحلة|الخطوة)\s+\S+:\s*/, "")}
          </button>
        ))}
      </div>
      {/* vertical timeline */}
      <div style={{ position: "relative", paddingInlineStart: 30 }}>
        <div style={{ position: "absolute", top: 8, bottom: 8, insetInlineStart: 8, width: 2, background: tint(c, .3) }}></div>
        <div style={{ display: "flex", flexDirection: "column", gap: 34 }}>
          {nodes.map((node, ni) => (
            <div key={ni} id={"phase-" + ni} style={{ position: "relative", scrollMarginTop: 84 }}>
              <span style={{ position: "absolute", insetInlineStart: -30, top: 10, width: 18, height: 18,
                             borderRadius: 999, background: c, border: "3px solid var(--bg)" }}></span>
              <div style={{ display: "inline-block", color: "#fff", fontWeight: 700, fontSize: 16.5,
                             borderRadius: 12, padding: "9px 16px", marginBottom: 4, background: c }}>
                {node.title}
              </div>
              <Links links={node.links} color={c} />
              {node.expert && (
                <div style={{ display: "inline-flex", alignItems: "center", gap: 8, fontSize: 14, fontWeight: 700,
                               padding: "5px 13px", borderRadius: 999, background: "#fef3c7", color: "#92400e",
                               border: "1px solid #f59e0b", marginTop: 6, marginBottom: 2 }}>
                  <Icon name="star" size={18} style={{ color: "#f59e0b" }} />
                  نصائح تشغيلية من الخبراء — منع الخسائر
                </div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 12, marginTop: 14 }}>
                {node.subnodes.map((sub, si) => <SubNodeCard key={si} sub={sub} color={c} expert={node.expert} />)}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Article({ activity, onOpen }) {
  const c = ACCENT[activity.accent];
  /* branch tab state — only used when activity.branches exists */
  const [activeBranch, setActiveBranch] = useState(0);

  /* reset branch selection when a different activity is opened */
  useEffect(() => { setActiveBranch(0); }, [activity.id]);

  const hasBranches = !!activity.branches;
  const currentNodes = hasBranches
    ? activity.branches[activeBranch].nodes
    : activity.nodes;
  const phaseCount = hasBranches
    ? activity.branches.reduce((s, b) => s + b.nodes.length, 0)
    : activity.nodes.length;

  return (
    <div style={{ maxWidth: 860, margin: "0 auto", padding: "34px 22px 80px" }}>
      {/* ── header ── */}
      <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 22 }}>
        <span style={{ width: 64, height: 64, flex: "0 0 auto", borderRadius: 16, background: tint(c, .13),
                       color: c, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name={MS_ICON[activity.icon]} size={38} />
        </span>
        <div>
          <h1 style={{ fontSize: 30, fontWeight: 800, letterSpacing: "-.02em", margin: 0 }}>{activity.titleAr}</h1>
          <div style={{ color: "var(--fg-muted)", fontSize: 17, marginTop: 2 }}>
            {hasBranches ? arNum(activity.branches.length) + " فروع" : arPhases(activity.nodes.length)}
          </div>
        </div>
      </div>

      {/* ── summary banner ── */}
      <div style={{ border: "1px solid var(--border)", borderInlineStart: "5px solid " + c, background: tint(c, .07),
                    borderRadius: 14, padding: "18px 20px", margin: "0 0 22px", display: "flex", gap: 14,
                    color: "var(--fg-muted)", fontSize: 17.5, lineHeight: 1.7 }}>
        <Icon name="lightbulb" size={28} style={{ color: c, flex: "0 0 auto" }} />
        <div><strong style={{ color: "var(--fg)" }}>باختصار: </strong>{activity.descAr}</div>
      </div>

      <Links links={activity.links} color={c} />

      {/* ── branch tabs (only for branched activities) ── */}
      {hasBranches && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", margin: "8px 0 6px",
                      background: tint(c, .07), borderRadius: 16, padding: 6 }}>
          {activity.branches.map((br, bi) => {
            const active = bi === activeBranch;
            return (
              <button key={br.id} onClick={() => { setActiveBranch(bi); window.scrollTo(0,0); }}
                      className="tap"
                      style={{ flex: 1, minWidth: 120, padding: "11px 16px", borderRadius: 12,
                               border: active ? "2px solid " + c : "2px solid transparent",
                               background: active ? "#fff" : "transparent",
                               color: active ? c : "var(--fg-muted)",
                               fontWeight: 700, fontSize: 15.5,
                               boxShadow: active ? "0 2px 8px " + tint(c, .18) : "none",
                               transition: "all .15s" }}>
                {br.titleAr}
              </button>
            );
          })}
        </div>
      )}

      {/* ── branch description strip ── */}
      {hasBranches && (
        <div style={{ fontSize: 15.5, color: "var(--fg-muted)", margin: "10px 0 4px",
                      padding: "10px 16px", background: tint(c, .06), borderRadius: 10,
                      borderInlineStart: "4px solid " + tint(c, .4) }}>
          {activity.branches[activeBranch].descAr}
        </div>
      )}

      {/* ── roadmap timeline ── */}
      <RoadmapTimeline nodes={currentNodes} c={c} />
    </div>
  );
}

/* search across activities, phases and sub-nodes (handles both nodes and branches) */
function searchAll(q) {
  const s = q.trim();
  if (!s) return [];
  const hit = (t) => !!t && t.indexOf(s) !== -1;
  const out = [];
  ACTIVITIES.forEach((act) => {
    if (hit(act.titleAr) || hit(act.descAr)) out.push({ act, phase: null, title: act.titleAr, sub: act.descAr });
    /* branched activities */
    if (act.branches) {
      act.branches.forEach((br) => {
        if (hit(br.titleAr) || hit(br.descAr)) out.push({ act, phase: null, title: br.titleAr, sub: act.titleAr });
        br.nodes.forEach((node, ni) => {
          if (hit(node.title)) out.push({ act, phase: ni, title: node.title, sub: act.titleAr + " — " + br.titleAr });
          node.subnodes.forEach((sn) => {
            if (hit(sn.title) || hit(sn.platform) || hit(sn.action) || (sn.requirements || []).some(hit))
              out.push({ act, phase: ni, title: sn.title, sub: act.titleAr + " / " + br.titleAr + " — " + node.title });
          });
        });
      });
    } else {
      /* regular activities */
      act.nodes.forEach((node, ni) => {
        if (hit(node.title)) out.push({ act, phase: ni, title: node.title, sub: act.titleAr });
        node.subnodes.forEach((sn) => {
          if (hit(sn.title) || hit(sn.platform) || hit(sn.action) || (sn.requirements || []).some(hit))
            out.push({ act, phase: ni, title: sn.title, sub: act.titleAr + " — " + node.title });
        });
      });
    }
  });
  return out.slice(0, 40);
}

function Search({ onOpen }) {
  const [q, setQ] = useState("");
  const results = searchAll(q);
  return (
    <div style={{ maxWidth: 860, margin: "0 auto", padding: "32px 20px 64px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, height: 72, padding: "0 22px",
                    border: "2px solid var(--accent)", borderRadius: 18, background: "var(--surface)", marginBottom: 24 }}>
        <Icon name="search" size={32} style={{ color: "var(--accent)" }} />
        <input autoFocus placeholder="ابحث عن نشاط أو مرحلة أو منصة…" value={q} onChange={(e) => setQ(e.target.value)}
               style={{ flex: 1, border: 0, outline: 0, background: "transparent", color: "var(--fg)", fontSize: 20 }} />
      </div>
      <div style={{ color: "var(--fg-muted)", fontSize: 16, marginBottom: 14 }}>
        {q.trim() ? (results.length ? arNum(results.length) + " نتيجة" : "لا توجد نتائج") : "اكتب كلمة للبحث في كل خرائط الطريق"}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {results.map((r, i) => {
          const c = ACCENT[r.act.accent];
          return (
            <button key={i} onClick={() => onOpen(r.act.id, r.phase)} className="tap"
                    style={{ display: "flex", alignItems: "center", gap: 16, width: "100%", padding: 20, minHeight: 78,
                             border: "1px solid var(--border)", borderRadius: 16, background: "var(--surface)", textAlign: "start" }}>
              <span style={{ width: 48, height: 48, flex: "0 0 auto", borderRadius: 12, background: tint(c, .13),
                             color: c, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon name={MS_ICON[r.act.icon]} size={26} />
              </span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontWeight: 700, fontSize: 18.5, lineHeight: 1.3 }}>{r.title}</div>
                <div style={{ color: "var(--fg-muted)", fontSize: 15, marginTop: 3 }}>{r.sub}</div>
              </div>
              <Icon name="chevron_left" size={28} style={{ color: "var(--border-strong)" }} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [scr, setScr] = useState("home");
  const [activeId, setActiveId] = useState(null);
  const [pendingPhase, setPendingPhase] = useState(null);
  const history = useRef([]);

  const active = ACTIVITIES.find((x) => x.id === activeId);

  const go = (next) => {
    if (next !== scr) history.current.push(scr);
    setScr(next);
    window.scrollTo(0, 0);
  };
  const openArticle = (id, phase) => {
    setActiveId(id);
    setPendingPhase(phase === undefined ? null : phase);
    go("article");
  };
  const back = () => { setScr(history.current.pop() || "home"); window.scrollTo(0, 0); };

  // scroll to the phase a search result pointed at, once the article is on screen
  useEffect(() => {
    if (scr !== "article" || pendingPhase === null) return;
    const el = document.getElementById("phase-" + pendingPhase);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 84 });
    setPendingPhase(null);
  }, [scr, activeId, pendingPhase]);

  // accent follows the open activity
  useEffect(() => {
    document.documentElement.style.setProperty(
      "--accent", active && scr === "article" ? ACCENT[active.accent] : "#2f5fd0");
  }, [active, scr]);

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <TopBar showBack={scr !== "home"} onBack={back} onHome={() => go("home")} onSearch={() => go("search")} />
      {scr === "search" ? <Search onOpen={openArticle} />
        : scr === "article" && active ? <Article activity={active} onOpen={openArticle} />
        : <Home onOpen={openArticle} onSearch={() => go("search")} />}

      <footer style={{ marginTop: 40, borderTop: "1px solid var(--border)", background: "var(--surface)" }}>
        <div style={{ maxWidth: 860, margin: "0 auto", padding: "24px 20px", textAlign: "center",
                      color: "var(--fg-muted)", fontSize: 15.5, lineHeight: 1.8 }}>
          <p style={{ margin: 0 }}>دليل توضيحي لتأسيس الأنشطة التجارية — البيانات للأغراض التدريبية وقابلة للتحديث.</p>
          <p style={{ margin: "4px 0 0" }}>© 2026 — أعد بكل حب بواسطة عمران ومصطفى ❤️. جميع الحقوق محفوظة.</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
