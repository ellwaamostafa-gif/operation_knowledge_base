/* ---------- components ---------- */

function DashboardCard({ activity, onOpen }) {
  const a = ACCENT[activity.accent];
  return (
    <button
      onClick={() => onOpen(activity.id)}
      aria-label={`فتح خارطة طريق ${activity.titleAr}`}
      className={`group text-right bg-white border border-slate-200 rounded-2xl p-6 shadow-sm
                  transition-all duration-200 hover:-translate-y-1 hover:shadow-md ${a.hover}
                  focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-300`}
    >
      <div className={`w-14 h-14 rounded-xl flex items-center justify-center mb-4 ${a.tint}`}>
        <Icon name={activity.icon} className="w-7 h-7" />
      </div>
      <h3 className="text-lg font-bold text-slate-800 mb-1">{activity.titleAr}</h3>
      <p className="text-sm text-slate-500 leading-relaxed">{activity.descAr}</p>
      <span className={`inline-block mt-4 text-sm font-medium ${a.head}`}>عرض خارطة الطريق ←</span>
    </button>
  );
}

function Dashboard({ onOpen }) {
  return (
    <div className="max-w-6xl mx-auto px-4 py-10">
      <header className="text-center mb-10">
        <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-3">
          دليل تأسيس الأنشطة التجارية في السعودية
        </h1>
        <p className="text-slate-500 max-w-2xl mx-auto">
          خرائط طريق تفصيلية خطوة بخطوة لترخيص وتشغيل تسعة أنشطة تجارية، مع المنصات والإجراءات والمتطلبات لكل مرحلة.
        </p>
      </header>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        {ACTIVITIES.map((act) => (
          <DashboardCard key={act.id} activity={act} onOpen={onOpen} />
        ))}
      </div>
    </div>
  );
}

function SubNodeCard({ sub, accent }) {
  const a = ACCENT[accent];
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
      <h4 className="font-bold text-slate-800 mb-2">{sub.title}</h4>

      {sub.platform && (
        <span className={`inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full mb-2 ${a.badge}`}>
          <span className="opacity-70">المنصة</span>
          <span>{sub.platform}</span>
        </span>
      )}

      {sub.action && (
        <p className="text-sm text-slate-600 leading-relaxed mb-2">
          <span className="text-slate-400 font-medium">الإجراء: </span>
          {sub.action}
        </p>
      )}

      {sub.requirements && sub.requirements.length > 0 && (
        <div className="mt-2">
          <div className="text-slate-400 font-medium text-sm mb-1.5">المتطلبات:</div>
          <ul className="space-y-1.5">
            {sub.requirements.map((r, i) => (
              <li key={i} className="flex gap-2 text-sm text-slate-600 leading-relaxed">
                <span className={`mt-1.5 w-1.5 h-1.5 rounded-full shrink-0 ${a.dot}`}></span>
                <span>{r}</span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

function Roadmap({ activity, onBack }) {
  const a = ACCENT[activity.accent];
  return (
    <div className="max-w-4xl mx-auto px-4 py-8">
      <div className="flex items-center justify-between gap-4 mb-8 flex-wrap">
        <div className="flex items-center gap-3">
          <div className={`w-12 h-12 rounded-xl flex items-center justify-center ${a.tint}`}>
            <Icon name={activity.icon} className="w-6 h-6" />
          </div>
          <div>
            <h2 className="text-2xl font-extrabold text-slate-800">{activity.titleAr}</h2>
            <p className="text-sm text-slate-500">{activity.descAr}</p>
          </div>
        </div>
        <button
          onClick={onBack}
          aria-label="الرجوع إلى اللوحة الرئيسية"
          className="text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-lg px-4 py-2
                     hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300"
        >
           رجوع للوحة الرئيسية ←
        </button>
      </div>

      {/* vertical timeline: connecting line on the right (RTL) */}
      <div className="relative pr-6 sm:pr-8">
        <div className={`absolute top-2 bottom-2 right-[7px] sm:right-[9px] w-0.5 ${a.line}`}></div>

        <div className="space-y-8">
          {activity.nodes.map((node, ni) => (
            <div key={ni} className="relative">
              {/* connector dot */}
              <span className={`absolute -right-6 sm:-right-8 top-3 w-4 h-4 rounded-full border-2 border-white ${a.dot}`}></span>

              {/* main node pill */}
              <div className={`inline-block text-white font-bold text-sm rounded-lg px-4 py-2 mb-4 shadow-sm ${a.node}`}>
                {node.title}
              </div>

              {/* sub-nodes */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {node.subnodes.map((sub, si) => (
                  <SubNodeCard key={si} sub={sub} accent={activity.accent} />
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("dashboard");
  const [activeId, setActiveId] = useState(null);
  const [mounted, setMounted] = useState(true);

  const go = (nextView, id) => {
    setMounted(false);
    setTimeout(() => {
      if (id !== undefined) setActiveId(id);
      setView(nextView);
      setMounted(true);
      try { window.scrollTo(0, 0); } catch (e) {}
    }, 200);
  };

  const active = ACTIVITIES.find((x) => x.id === activeId);

  return (
    <div className={`min-h-screen bg-slate-50 transition-all duration-200 ${mounted ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2"}`}>
      {view === "dashboard" || !active
        ? <Dashboard onOpen={(id) => go("roadmap", id)} />
        : <Roadmap activity={active} onBack={() => go("dashboard")} />}

      <footer className="mt-16 border-t border-slate-200 bg-white">
        <div className="max-w-6xl mx-auto px-4 py-6 text-center text-sm text-slate-500 leading-relaxed">
          <p>دليل توضيحي لتأسيس الأنشطة التجارية — البيانات للأغراض التدريبية وقابلة للتحديث.</p>
          <p className="mt-1"> 2026@— أعد بكل حب بواسطة عمران ومصطفى ❤️. جميع الحقوق محفوظة.</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
